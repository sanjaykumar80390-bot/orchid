name: Build Orchid APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
      
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.0'
          channel: 'stable'
          cache: true
      
      - name: Install dependencies
        run: flutter pub get
        
      - name: Create Android files
        run: flutter create .
      
      - name: Update Kotlin version
        run: |
          sed -i 's/org.jetbrains.kotlin.android:1.7.10/org.jetbrains.kotlin.android:1.9.0/g' android/settings.gradle
          sed -i "s/ext.kotlin_version = '1.7.10'/ext.kotlin_version = '1.9.0'/g" android/build.gradle
      
      - name: Build APK
        run: flutter build apk --release
      
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: orchid-app
          path: build/app/outputs/flutter-apk/app-release.apk
